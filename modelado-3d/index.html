<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La Última Acequia · Modelado 3D</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:16px/1.45 system-ui,sans-serif;color:#eeeedd;background:#18251e}main{height:100%;min-height:240px;position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(ellipse at 48% 44%,#3e5141,#1b2a21 62%,#121c17)}model-viewer{display:block;width:100%;height:100%;--progress-bar-color:#b8dd96}header{position:absolute;inset:16px auto auto 18px;pointer-events:none;background:#17241de8;color:#f1f2e8;padding:6px 12px;border-radius:6px}h1{font:500 1.1rem Georgia,serif;margin:0}footer{position:absolute;bottom:16px;left:16px;right:16px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}button,#estado{border:0;border-radius:8px;padding:10px 16px;font:inherit}button{background:#ebf0d9;color:#17241a;cursor:pointer}button:focus-visible{outline:3px solid #d6ad63;outline-offset:2px}#estado{background:#17241def;color:white;font-size:.88rem}#estado:empty,[hidden]{display:none}
</style>
<main>
  <model-viewer id="visor" camera-controls touch-action="pan-y" interaction-prompt="none" camera-orbit="0deg 40deg 3.7m" camera-target="-0.25m 0m -1.3m" field-of-view="30deg" min-camera-orbit="auto auto 2m" alt="Encuentro del tomate y el puerro con el caracol y su dron en La Última Acequia"></model-viewer>
  <header><h1>La Última Acequia</h1></header>
  <footer><span role="status" id="estado"></span><button id="abrir">Explorar en 3D</button><button id="volver-vista" hidden>Volver a la vista inicial</button><button id="animar" hidden>Pausar animación</button></footer>
</main>
<script type="module">
const visor = document.querySelector('#visor');
const estado = document.querySelector('#estado');
const abrir = document.querySelector('#abrir');
const volverVista = document.querySelector('#volver-vista');
const animar = document.querySelector('#animar');
const escena = './Escenario%20final.glb';
const vistaInicial = {
  orbit: visor.getAttribute('camera-orbit'),
  target: visor.getAttribute('camera-target'),
  fieldOfView: visor.getAttribute('field-of-view')
};
let iniciado = false;
function restablecerVista() {
  visor.setAttribute('camera-orbit', vistaInicial.orbit);
  visor.setAttribute('camera-target', vistaInicial.target);
  visor.setAttribute('field-of-view', vistaInicial.fieldOfView);
  visor.jumpCameraToGoal();
}
function reproducir() {
  visor.play();
  if (!iniciado) {
    for (const clip of visor.availableAnimations.slice(1)) visor.appendAnimation(clip);
    iniciado = true;
  }
  animar.textContent = 'Pausar animación';
}
function fallo() {
  estado.textContent = 'No se pudo cargar la escena. Verifica que modelado-3d/Escenario final.glb esté publicado.';
  abrir.hidden = false;
  abrir.textContent = 'Reintentar';
  volverVista.hidden = true;
  animar.hidden = true;
}
abrir.onclick = async () => {
  abrir.hidden = true;
  estado.textContent = 'Cargando La Última Acequia…';
  try {
    const respuesta = await fetch(escena, { method: 'HEAD' });
    if (!respuesta.ok) throw new Error(`No se encontró la escena (HTTP ${respuesta.status}).`);
    await import('./vendor/model-viewer.min.js');
    customElements.get('model-viewer').dracoDecoderLocation = new URL('./vendor/draco/', location.href).href;
    visor.src = escena;
  } catch (error) {
    console.error('No se pudo iniciar el visor 3D:', error);
    fallo();
  }
};
visor.addEventListener('error', () => { visor.removeAttribute('src'); iniciado = false; fallo(); });
visor.addEventListener('load', () => {
  estado.textContent = '';
  volverVista.hidden = false;
  if (visor.availableAnimations.length) {
    animar.hidden = false;
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) animar.textContent = 'Reproducir animación';
    else reproducir();
  }
});
volverVista.onclick = restablecerVista;
animar.onclick = () => {
  if (visor.paused) reproducir();
  else { visor.pause(); animar.textContent = 'Reproducir animación'; }
};
</script>
</html>
